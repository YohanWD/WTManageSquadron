repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: python -m unittest discover -s tests/
        language: python
        'types': [python]
        pass_filenames: false
        stages: [pre-commit]
